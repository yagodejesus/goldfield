[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goldfield"
version = "0.1.0"
description = "Field-level evaluation for LLM data extraction: precision, recall and F1 per field, with smart matching for numbers, dates, currencies, fuzzy text and lists."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["llm", "evaluation", "information extraction", "structured output", "f1", "document ai", "invoices", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/yagodejesus/goldfield"
Issues = "https://github.com/yagodejesus/goldfield/issues"

[project.scripts]
goldfield = "goldfield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldfield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]
